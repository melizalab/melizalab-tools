[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melizalab-tools"
version = "2026.10.07"
description = "Meliza lab scripts and modules for auditory neurophysiology"
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "BSD 3-Clause License"}
authors = [
    {name = "C Daniel Meliza", email = "dan@meliza.org"},
]
maintainers = [
    {name = "C Daniel Meliza", email = "dan@meliza.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "appdirs>=1.4.4",
    "arf>=2.7.2",
    "ewave>=1.0.10",
    "libtfr>=2.1.9",
    "neurobank>=0.12,<0.13",
    "pandas>=2.3.1",
    "pyyaml>=6.0.2",
    "samplerate>=0.2.3",
    "scipy>=1.15.3",
    "toelis>=2.1.4",
]

[project.urls]
Homepage = "https://github.com/melizalab/melizalab-tools"

[project.scripts]
group-kilo-spikes = "dlab.kilo:group_spikes_script"
get-songs = "dlab.get_songs:script"
audit-kilo-spikes = "dlab.kilo_audit:script"
find-kilo-units = "dlab.kilo_audit:find_units_script"
collect-kilo-audit = "dlab.kilo_audit:collect_script"

[project.optional-dependencies]
audio = ["samplerate>=0.2.3"]

[dependency-groups]
dev = [
    "jsonschema>=4.18",
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "referencing>=0.37.0",
    "ruff>=0.14.3",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["attic", "venv", "tests/data/*_sorting"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
ignore = ["E221", "E501", "E701", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.hatch.build.targets.wheel]
packages = ["dlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests that need the large example recordings in examples/ are marked slow and
# deselected by default; run them with `pytest -m slow`
addopts = "-m 'not slow'"
markers = ["slow: needs the large example recordings in examples/"]
